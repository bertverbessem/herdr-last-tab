id = "bertverbessem.last-tab"
name = "Last Tab"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Toggle between the current and previously focused tab within a workspace."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[actions]]
id = "toggle"
title = "Last tab"
contexts = ["global", "workspace"]
command = ["./target/release/herdr-last-tab", "toggle"]

[[events]]
on = "tab.focused"
command = ["./target/release/herdr-last-tab", "focused"]

[[events]]
on = "tab.closed"
command = ["./target/release/herdr-last-tab", "closed"]
